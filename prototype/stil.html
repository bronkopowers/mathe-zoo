<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stilprobe</title>
<style>
  :root { --ink: #3b2f24; --paper: #e6dcc0; --rust: #a65a2e; --moss: #6f7d4a; --teal: #4f7a78; --ochre: #c9a24a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: #2f2822; color: var(--paper); font-family: "Chalkboard SE", "Bradley Hand", "Marker Felt", "Comic Sans MS", cursive; padding: 14px 16px 40px; }
  header { max-width: 900px; margin: 0 auto 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 1.15rem; margin: 0; flex: 1; font-weight: 400; opacity: .8; }
  .tab { font: inherit; font-size: 1.05rem; color: var(--paper); background: transparent; border: 2px solid #6b5d4f; padding: 6px 16px; border-radius: 14px 20px 12px 18px / 18px 12px 20px 14px; cursor: pointer; }
  .tab.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
  .stage { max-width: 900px; margin: 0 auto; display: none; }
  .stage.on { display: block; }
  .frame { background: var(--paper); padding: 8px; border-radius: 10px 16px 12px 18px / 16px 10px 18px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  svg.scene { display: block; width: 100%; height: auto; border-radius: 6px; }
  .panel { margin-top: 10px; background: var(--paper); color: var(--ink); border-radius: 14px 10px 18px 12px / 10px 18px 12px 16px; padding: 12px 16px 16px; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .panel .who { font-size: .95rem; opacity: .75; min-height: 1.4em; }
  .panel .q { font-size: 2.3rem; margin: 2px 0 10px; letter-spacing: 1px; }
  .answers { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .ans { font: inherit; font-size: 1.8rem; color: var(--ink); min-width: 110px; padding: 8px 18px; background: #d3c5a0; border: 2.5px solid var(--ink); border-radius: 16px 22px 14px 20px / 20px 14px 22px 16px; box-shadow: 3px 4px 0 var(--ink); cursor: pointer; transition: transform .08s; }
  .ans:nth-child(2) { border-radius: 22px 14px 20px 16px / 14px 22px 16px 20px; transform: rotate(-1deg); }
  .ans:nth-child(3) { transform: rotate(1.2deg); }
  .ans:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .ans.no { animation: shake .35s; background: #d9a590; }
  .again { font: inherit; font-size: 1.2rem; margin-top: 6px; padding: 6px 18px; background: var(--teal); color: #fff; border: 0; border-radius: 16px 22px 14px 20px / 20px 14px 22px 16px; cursor: pointer; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }

  /* gemeinsame Zeichen-Stile */
  .art { stroke: var(--ink); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
  .thin { stroke-width: 1.3; opacity: .6; }
  .bob { animation: bob 2.6s ease-in-out infinite; }
  .waddle { animation: waddle 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  .swing { animation: swing 2.2s ease-in-out infinite; transform-origin: 22px -24px; }
  .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  .bulb { animation: pulse 1.6s ease-in-out infinite; }
  .hop { animation: hop .5s ease 3; }
  @keyframes bob { 50% { transform: translateY(-2.5px); } }
  @keyframes waddle { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  @keyframes swing { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes blink { 0%, 46%, 50%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes hop { 50% { transform: translateY(-16px); } }
  @keyframes puff { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: .7; } 100% { transform: translateY(-46px) scale(1.5); opacity: 0; } }
  @keyframes floaty { 50% { transform: translateY(-8px) rotate(3deg); } }

  .lamp { fill: #7d7361; transition: fill .5s; }
  .step1 .l1, .step2 .l1, .step3 .l1, .step2 .l2, .step3 .l2, .step3 .l3 { fill: #f8cf55; }
  .halo { opacity: 0; transition: opacity .6s; }
  .step1 .h1, .step2 .h1, .step3 .h1, .step2 .h2, .step3 .h2, .step3 .h3 { opacity: .55; }

  /* Expedition */
  #s-exp .gate { transform: translateY(calc(var(--s) * -68px)); transition: transform 1.3s cubic-bezier(.5, 0, .3, 1); }
  #s-exp .ga { transform: rotate(calc(var(--s) * 120deg)); transition: transform 1.3s; }
  #s-exp .gb { transform: rotate(calc(var(--s) * -146deg)); transition: transform 1.3s; }
  #s-exp .treasure { opacity: 0; transition: opacity .8s 1s; }
  #s-exp.step3 .treasure { opacity: 1; }
  #s-exp.step3 .treasure .piece { animation: floaty 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  /* Zoo */
  #s-zoo .giraffe { transform: translateY(calc(172px - var(--s) * 57.3px)); transition: transform 1.2s cubic-bezier(.3, 1.5, .5, 1); }
  #s-zoo .water { transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(calc(.06 + var(--s) * .31)); transition: transform 1.2s; }
  #s-zoo .wheel { transform: rotate(calc(var(--s) * 200deg)); transition: transform 1.2s; }
  #s-zoo .wing { transform-box: fill-box; transition: transform 1.4s cubic-bezier(.5, 0, .3, 1) .3s; }
  #s-zoo .wingL { transform-origin: 0 50%; }
  #s-zoo .wingR { transform-origin: 100% 50%; }
  #s-zoo.step3 .wing { transform: scaleX(.14); }
  #s-zoo .plate { transform-box: fill-box; transform-origin: 50% 0; transform: rotate(24deg); transition: transform 1s cubic-bezier(.3, 1.8, .5, 1) .6s; }
  #s-zoo.step3 .plate { transform: rotate(0); }
  #s-zoo .puff { opacity: 0; transform-box: fill-box; transform-origin: center; }
  #s-zoo.step1 .puff, #s-zoo.step2 .puff, #s-zoo.step3 .puff { animation: puff 2.4s ease-out infinite; }
  #s-zoo .puff.p2 { animation-delay: 1.2s !important; }
  #s-zoo .heart { opacity: 0; transition: opacity .5s 1.4s; }
  #s-zoo.step3 .heart { opacity: 1; animation: floaty 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
<header>
  <h1>Stilprobe · handgezeichnet, die Aufgaben bewegen die Szene</h1>
  <button class="tab on" data-t="zoo">Der vergessene Zoo</button>
  <button class="tab" data-t="exp">Die verschollene Stadt</button>
</header>

<!-- gemeinsame Filter -->
<svg width="0" height="0" style="position:absolute">

    <filter id="wob" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="wob2" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>

    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="glowf" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="2"/>
      <feColorMatrix values="0 0 0 0 .30  0 0 0 0 .22  0 0 0 0 .14  .75 0 0 0 -.18"/>
    </filter>
    <filter id="blot" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .27  0 0 0 0 .16  .9 0 0 0 -.38"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="62%" stop-color="#3b2f24" stop-opacity="0"/><stop offset="100%" stop-color="#3b2f24" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0"/><stop offset="60%" stop-color="#e2a93a" stop-opacity=".7"/><stop offset="100%" stop-color="#e2a93a" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>

<script>
// Zahnräder zeichnen
function gear(r, n) {
  const ri = r * 0.76; let d = '';
  const p = (rad, a) => `${(rad * Math.cos(a)).toFixed(1)} ${(rad * Math.sin(a)).toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * 2 * Math.PI, s = Math.PI / n;
    d += `${i ? 'L' : 'M'}${p(ri, a - s * 0.55)} L${p(r, a - s * 0.3)} L${p(r, a + s * 0.3)} L${p(ri, a + s * 0.55)} `;
  }
  return d + 'Z';
}
document.querySelectorAll('.gearp').forEach((el) => el.setAttribute('d', gear(+el.dataset.r, +el.dataset.n)));

const WORLDS = {
  zoo: {
    intro: 'Die alte Wasserpumpe steht still. Dreh sie mit drei richtigen Antworten wieder an!',
    steps: ['Es gluckert in den Rohren …', 'Wer schaut denn da über die Mauer?', 'Das Tor ist offen. Die Giraffe hat wieder Wasser!'],
    tasks: [{ q: '4 · 6', a: 24, c: [28, 24, 18] }, { q: '345 + 30', a: 375, c: [375, 348, 645] }, { q: '18 : 3', a: 6, c: [5, 9, 6] }],
  },
  exp: {
    intro: 'Das Steintor klemmt. Jede richtige Antwort dreht die Zahnräder ein Stück weiter.',
    steps: ['Es knirscht im Gemäuer …', 'Das Tor hebt sich. Noch ein Stück!', 'Geschafft! Dahinter liegt ein Stück der alten Karte.'],
    tasks: [{ q: '7 · 8', a: 56, c: [54, 56, 63] }, { q: '1 000 − 250', a: 750, c: [850, 650, 750] }, { q: '4 200 + 800', a: 5000, c: [5000, 4280, 5200] }],
  },
};

function setup(id) {
  const w = WORLDS[id], svg = document.getElementById('s-' + id), panel = document.getElementById('p-' + id);
  let step = 0;
  const draw = (msg) => {
    svg.style.setProperty('--s', step);
    svg.classList.remove('step1', 'step2', 'step3');
    if (step) svg.classList.add('step' + step);
    if (step >= 3) {
      panel.innerHTML = `<div class="who">${w.steps[2]}</div><div class="q">★ ★ ★</div><button class="again">Nochmal</button>`;
      panel.querySelector('.again').onclick = () => { step = 0; draw(); };
      return;
    }
    const t = w.tasks[step];
    panel.innerHTML = `<div class="who">${msg || (step ? w.steps[step - 1] : w.intro)}</div><div class="q">${t.q} = ?</div><div class="answers">${t.c.map((c) => `<button class="ans" data-v="${c}">${c.toLocaleString('de-DE').replace('.', ' ')}</button>`).join('')}</div>`;
    panel.querySelectorAll('.ans').forEach((b) => (b.onclick = () => {
      if (+b.dataset.v === t.a) { step++; draw(); }
      else { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); panel.querySelector('.who').textContent = 'Fast! Schau nochmal genau hin.'; }
    }));
  };
  draw();
}
setup('zoo'); setup('exp');

document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => {
  document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('on', x === b));
  document.querySelectorAll('.stage').forEach((s) => s.classList.toggle('on', s.id === 'st-' + b.dataset.t));
}));
</script>
